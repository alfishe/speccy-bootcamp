<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZX Spectrum Port Map</title>
<style>
:root {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --bg-tag: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --accent: #0284c7;
  --accent-bg: rgba(2, 132, 199, 0.12);
  --bit-0: #e11d48;
  --bit-1: #059669;
  --bit-x: #e2e8f0;
  --bit-var: #d97706;
  --bit-unk: #7c3aed;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070a12;
    --bg-card: #0d1424;
    --bg-tag: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-dim: #64748b;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.15);
    --bit-x: #334155;
  }
}
[data-theme="dark"] {
  --bg: #070a12;
  --bg-card: #0d1424;
  --bg-tag: #1e293b;
  --border: #334155;
  --text: #f8fafc;
  --text-dim: #64748b;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-bg: rgba(56, 189, 248, 0.15);
  --bit-x: #334155;
}
[data-theme="warm"] {
  --bg: #faf5f0;
  --bg-card: #ffffff;
  --bg-tag: #f5ebe0;
  --border: #e6d5c3;
  --text: #1c1917;
  --text-dim: #a8a29e;
  --text-muted: #78716c;
  --accent: #b45309;
  --accent-bg: rgba(180, 83, 9, 0.1);
  --bit-0: #dc2626;
  --bit-1: #059669;
  --bit-x: #e7e5e4;
  --bit-var: #d97706;
}
[data-theme="midnight"] {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-tag: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #484f58;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-bg: rgba(88, 166, 255, 0.15);
  --bit-0: #f85149;
  --bit-1: #3fb950;
  --bit-x: #30363d;
  --bit-var: #d29922;
  --bit-unk: #a371f7;
}
[data-theme="sinclair"] {
  --bg: #000000;
  --bg-card: #0a0a0a;
  --bg-tag: #1a1a1a;
  --border: #333;
  --text: #00ffff;
  --text-dim: #006666;
  --text-muted: #00aaaa;
  --accent: #ff00ff;
  --accent-bg: rgba(255, 0, 255, 0.15);
  --bit-0: #ff0000;
  --bit-1: #00ff00;
  --bit-x: #222;
  --bit-var: #ffff00;
  --bit-unk: #ff00ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
h1 span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stats { font-size: 13px; color: var(--text-muted); font-family: ui-monospace, monospace; }
.stats b { color: var(--accent); }
.theme-btns { display: flex; gap: 4px; }
.theme-btn {
  background: var(--bg-tag);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.theme-btn:hover, .theme-btn.active { border-color: var(--accent); color: var(--accent); }

main { max-width: 1900px; margin: 0 auto; padding: 20px 24px 80px; }

.filters {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.filter-section { display: flex; flex-direction: column; gap: 8px; }
.filter-header {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
}

.model-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 6px;
}
.model-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
}
.model-chip:hover { border-color: var(--accent); background: var(--bg-card); }
.model-chip.active { background: var(--accent-bg); border-color: var(--accent); }
.model-code {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  color: #fff;
}
.model-chip .name { font-size: 11px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-chip.active .name { color: var(--text); font-weight: 500; }

.section-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.section-chip {
  padding: 4px 9px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
}
.section-chip:hover { border-color: var(--accent); color: var(--text); }
.section-chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }

.search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search {
  flex: 1;
  min-width: 200px;
  max-width: 400px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  outline: none;
}
.search:focus { border-color: var(--accent); }
.search::placeholder { color: var(--text-dim); }
.clear-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
}
.clear-btn:hover { border-color: var(--accent); color: var(--text); }

.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; min-width: 1000px; table-layout: fixed; }
th:nth-child(1) { width: 10%; }
th:nth-child(2) { width: 12%; }
th:nth-child(3) { width: 20%; }
th:nth-child(4) { width: 14%; }
th:nth-child(5) { width: 14%; }
th:nth-child(6) { width: 30%; }
th {
  text-align: left;
  padding: 12px 14px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  background: var(--bg-tag);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
}
th:hover { color: var(--accent); }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: var(--accent-bg); }

.port { font-family: ui-monospace, monospace; font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 13px; }

.section-label {
  display: inline-block;
  background: var(--bg-tag);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  color: var(--text-muted);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.decode-table { border-collapse: collapse; font-family: ui-monospace, monospace; }
.decode-table td { padding: 0; vertical-align: middle; }
.decode-table .row-label { font-size: 8px; color: var(--text-dim); padding-right: 3px; text-align: right; white-space: nowrap; }
.decode-table .bit-row td { padding-bottom: 1px; }
.bit { display: inline-block; width: 12px; height: 12px; line-height: 12px; text-align: center; font-size: 9px; font-weight: 700; border-radius: 1px; }
.bit-0 { background: var(--bit-0); color: #fff; }
.bit-1 { background: var(--bit-1); color: #fff; }
.bit-x { background: var(--bit-x); color: var(--text-dim); }
.bit-v { background: var(--bit-var); color: #000; }
.bit-u { background: var(--bit-unk); color: #fff; }
.mask-char { display: inline-block; width: 12px; text-align: center; font-size: 9px; color: var(--text-muted); }

.fn { font-family: ui-monospace, monospace; font-size: 12px; }
.fn-r { color: var(--accent); }
.fn-w { color: var(--bit-1); }
.fn-none { color: var(--text-dim); }

.models-cell { display: flex; flex-direction: column; gap: 3px; }
.model-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  padding: 2px 6px;
  background: var(--bg-tag);
  border-radius: 3px;
  white-space: nowrap;
}
.model-tag-code {
  font-family: ui-monospace, monospace;
  font-weight: 700;
  color: #fff;
  padding: 0 4px;
  border-radius: 2px;
  font-size: 9px;
}
.model-tag-name { color: var(--text-muted); }

.empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 15px; }

.legend {
  margin-top: 20px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-bit { width: 18px; height: 18px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>ZX Spectrum <span>Port Map</span></h1>
  <div class="header-right">
    <div class="stats">Showing <b id="count">0</b> of <b id="total">0</b> ports</div>
    <div class="theme-btns">
      <button class="theme-btn active" onclick="setTheme('light')">Light</button>
      <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
      <button class="theme-btn" onclick="setTheme('warm')">Warm</button>
      <button class="theme-btn" onclick="setTheme('midnight')">Midnight</button>
      <button class="theme-btn" onclick="setTheme('sinclair')">Sinclair</button>
    </div>
  </div>
</header>

<main>
  <div class="filters">
    <div class="filter-section">
      <div class="filter-header">Computer Models</div>
      <div class="model-grid" id="model-grid"></div>
    </div>
    <div class="filter-section">
      <div class="filter-header">Peripherals & Interfaces</div>
      <div class="section-wrap" id="section-wrap"></div>
    </div>
    <div class="search-row">
      <input type="text" class="search" id="search" placeholder="Search port address, function name...">
      <button class="clear-btn" onclick="clearFilters()">Clear All</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="port">Port</th>
          <th data-sort="section">Section</th>
          <th>Address / Decoding (A15–A0)</th>
          <th data-sort="read">Read</th>
          <th data-sort="write">Write</th>
          <th>Models</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-bit bit-1">1</div> Must be HIGH</div>
    <div class="legend-item"><div class="legend-bit bit-0">0</div> Must be LOW</div>
    <div class="legend-item"><div class="legend-bit bit-x">x</div> Don't care (mirror)</div>
    <div class="legend-item"><div class="legend-bit bit-v">A</div> Variable / register select</div>
    <div class="legend-item"><div class="legend-bit bit-u">?</div> Unknown decoding</div>
  </div>
</main>

  {port:"#FBDF",section:"Kempston Mouse",address:"1111101111011111",decoding:"xxxxx011xx0xxxxx",read:"Kmou_X",write:"—",models:[]},
  {port:"#FFDF",section:"Kempston Mouse",address:"1111111111011111",decoding:"xxxxx111xx0xxxxx",read:"Kmou_Y",write:"—",models:[]},
  {port:"#FADF",section:"USSR Kempston Mouse",address:"1111101011011111",decoding:"xxxxx0x01x0xxxx1",read:"Kmou_B",write:"—",models:[]},
  {port:"#FBDF",section:"USSR Kempston Mouse",address:"1111101111011111",decoding:"xxxxx0x11x0xxxx1",read:"Kmou_X",write:"—",models:[]},
  {port:"#FFDF",section:"USSR Kempston Mouse",address:"1111111111011111",decoding:"xxxxx1x11x0xxxx1",read:"Kmou_Y",write:"—",models:[]}
];

const state = { models: new Set(), sections: new Set(), search: '', sort: 'port', asc: true };

function init() {
  const modelGrid = document.getElementById('model-grid');
  Object.entries(MODELS).forEach(([code, m]) => {
    const chip = document.createElement('div');
    chip.className = 'model-chip';
    chip.dataset.model = code;
    chip.innerHTML = `<span class="model-code" style="background:${m.color}">${code}</span><span class="name">${m.name}</span>`;
    chip.onclick = () => toggleModel(code);
    modelGrid.appendChild(chip);
  });

  const sections = [...new Set(PORTS.map(p => p.section))].sort();
  const sectionWrap = document.getElementById('section-wrap');
  sections.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'section-chip';
    chip.dataset.section = s;
    chip.textContent = s;
    chip.onclick = () => toggleSection(s);
    sectionWrap.appendChild(chip);
  });

  document.getElementById('search').oninput = e => { state.search = e.target.value.toLowerCase(); render(); };
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.onclick = () => {
      if (state.sort === th.dataset.sort) state.asc = !state.asc;
      else { state.sort = th.dataset.sort; state.asc = true; }
      render();
    };
  });

  document.getElementById('total').textContent = PORTS.length;
  render();
}

function toggleModel(code) {
  state.models.has(code) ? state.models.delete(code) : state.models.add(code);
  document.querySelector(`[data-model="${code}"]`).classList.toggle('active');
  render();
}

function toggleSection(s) {
  state.sections.has(s) ? state.sections.delete(s) : state.sections.add(s);
  document.querySelector(`[data-section="${s}"]`).classList.toggle('active');
  render();
}

function clearFilters() {
  state.models.clear();
  state.sections.clear();
  state.search = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.model-chip.active, .section-chip.active').forEach(el => el.classList.remove('active'));
  render();
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === t));
}

function filter(ports) {
  return ports.filter(p => {
    // Model filter: show if no filter, or port is universal (no models), or port matches selected models
    if (state.models.size && p.models.length > 0 && !p.models.some(m => state.models.has(m))) return false;
    if (state.sections.size && !state.sections.has(p.section)) return false;
    if (state.search) {
      const hay = `${p.port} ${p.section} ${p.read} ${p.write} ${p.decoding} ${p.address || ''}`.toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    return true;
  });
}

function sortPorts(ports) {
  return [...ports].sort((a, b) => {
    let va = a[state.sort] || '', vb = b[state.sort] || '';
    if (state.sort === 'port') {
      va = parseInt(a.port.replace(/[^0-9A-Fa-f]/g, '').substring(0, 4), 16) || 0;
      vb = parseInt(b.port.replace(/[^0-9A-Fa-f]/g, '').substring(0, 4), 16) || 0;
    }
    if (va < vb) return state.asc ? -1 : 1;
    if (va > vb) return state.asc ? 1 : -1;
    return 0;
  });
}

function pad16(s) {
  let d = s.padStart(16, 'x');
  return d.length > 16 ? d.slice(-16) : d;
}

function bitCells(dec) {
  return pad16(dec).split('').map(c => {
    if (c === '0') return '<td><span class="bit bit-0">0</span></td>';
    if (c === '1') return '<td><span class="bit bit-1">1</span></td>';
    if (c === '?') return '<td><span class="bit bit-u">?</span></td>';
    if (/[A-L]/.test(c)) return `<td><span class="bit bit-v">${c}</span></td>`;
    return '<td><span class="bit bit-x">x</span></td>';
  }).join('');
}

function maskCells(s) {
  return pad16(s).split('').map(c => `<td><span class="mask-char">${c}</span></td>`).join('');
}

function render() {
  const filtered = sortPorts(filter(PORTS));
  document.getElementById('count').textContent = filtered.length;

  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No matching ports found</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(p => `
    <tr>
      <td class="port">${p.port}</td>
      <td><span class="section-label" title="${p.section}">${p.section}</span></td>
      <td>
        <table class="decode-table">
          <tr class="bit-row"><td class="row-label"></td>${bitCells(p.decoding)}</tr>
          <tr><td class="row-label">Addr:</td>${maskCells(p.address || p.decoding)}</tr>
          <tr><td class="row-label">Mask:</td>${maskCells(p.decoding)}</tr>
        </table>
      </td>
      <td class="fn ${p.read === '—' ? 'fn-none' : 'fn-r'}">${p.read}</td>
      <td class="fn ${p.write === '—' ? 'fn-none' : 'fn-w'}">${p.write}</td>
      <td>
        <div class="models-cell">${p.models.length ? p.models.map(m => `<span class="model-tag"><span class="model-tag-code" style="background:${MODELS[m]?.color || '#666'}">${m}</span><span class="model-tag-name">${MODELS[m]?.name || m}</span></span>`).join('') : '—'}</div>
      </td>
    </tr>
  `).join('');
}

init();
</script>
</body>
</html>
