<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Menlo','Consolas','Courier New',monospace">
  <rect x="0" y="0" width="720" height="470" fill="#1e1e2e" stroke="#6c7086" stroke-width="1" rx="6"/>
  <text x="360" y="28" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">Pentagon 1024: #7FFD Paging + #EFF7 Control Decode</text>

  <!-- ===== Component: dec138 ===== -->
  <rect x="240" y="80.0" width="150" height="100" fill="#313244" stroke="#9399b2" stroke-width="1.5" rx="2"/>
  <text x="315" y="122" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">74HC138</text>
  <text x="315" y="136" text-anchor="middle" fill="#9399b2" font-size="8">КР1533ИД7</text>
  <line x1="222" y1="92.0" x2="240" y2="92.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="95.0" text-anchor="start" fill="#9399b2" font-size="7">A (A1)</text>
  <line x1="222" y1="106.0" x2="240" y2="106.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="109.0" text-anchor="start" fill="#9399b2" font-size="7">B (GND)</text>
  <line x1="222" y1="120.0" x2="240" y2="120.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="123.0" text-anchor="start" fill="#9399b2" font-size="7">C (GND)</text>
  <line x1="222" y1="134.0" x2="240" y2="134.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="137.0" text-anchor="start" fill="#9399b2" font-size="7">G1 (A14)</text>
  <line x1="222" y1="148.0" x2="240" y2="148.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="151.0" text-anchor="start" fill="#9399b2" font-size="7">/G2A (A15)</text>
  <line x1="222" y1="162.0" x2="240" y2="162.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="165.0" text-anchor="start" fill="#9399b2" font-size="7">/G2B (/IORQ./WR)</text>
  <line x1="390" y1="92.0" x2="408" y2="92.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="386" y="95.0" text-anchor="end" fill="#9399b2" font-size="7">Y0 (#7FFD)</text>

  <!-- ===== Component: cmp688 ===== -->
  <rect x="240" y="229.0" width="160" height="142" fill="#313244" stroke="#9399b2" stroke-width="1.5" rx="2"/>
  <text x="320" y="292" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">74HC688</text>
  <text x="320" y="306" text-anchor="middle" fill="#9399b2" font-size="8">КР1533СП1</text>
  <line x1="222" y1="241.0" x2="240" y2="241.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="244.0" text-anchor="start" fill="#9399b2" font-size="7">P0 (A3)</text>
  <line x1="222" y1="255.0" x2="240" y2="255.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="258.0" text-anchor="start" fill="#9399b2" font-size="7">P1 (A12)</text>
  <line x1="222" y1="269.0" x2="240" y2="269.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="272.0" text-anchor="start" fill="#9399b2" font-size="7">P2 (A13)</text>
  <line x1="222" y1="283.0" x2="240" y2="283.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="286.0" text-anchor="start" fill="#9399b2" font-size="7">P3 (A14)</text>
  <line x1="222" y1="297.0" x2="240" y2="297.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="300.0" text-anchor="start" fill="#9399b2" font-size="7">P4 (A15)</text>
  <line x1="222" y1="311.0" x2="240" y2="311.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="314.0" text-anchor="start" fill="#9399b2" font-size="7">P5 (Q5)</text>
  <line x1="222" y1="325.0" x2="240" y2="325.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="328.0" text-anchor="start" fill="#9399b2" font-size="7">P6 (Q6)</text>
  <line x1="222" y1="339.0" x2="240" y2="339.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="342.0" text-anchor="start" fill="#9399b2" font-size="7">P7 (Q7)</text>
  <line x1="222" y1="353.0" x2="240" y2="353.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="244" y="356.0" text-anchor="start" fill="#9399b2" font-size="7">/G (/IORQ./WR)</text>
  <line x1="400" y1="241.0" x2="418" y2="241.0" stroke="#9399b2" stroke-width="1.5"/>
  <text x="396" y="244.0" text-anchor="end" fill="#9399b2" font-size="7">/P=Q (#EFF7)</text>

  <!-- ===== Wire ===== -->
  <line x1="60" y1="110" x2="140" y2="110" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="140" y1="110" x2="140" y2="92.0" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="140" y1="92.0" x2="222" y2="92.0" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="60" y1="110" x2="180" y2="110" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="180" y2="241.0" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="180" y1="241.0" x2="222" y2="241.0" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="60" y1="240" x2="140" y2="240" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="140" y1="240" x2="140" y2="162.0" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="140" y1="162.0" x2="222" y2="162.0" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="60" y1="240" x2="110" y2="240" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="110" y1="240" x2="110" y2="353.0" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="110" y1="353.0" x2="222" y2="353.0" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="408" y1="92.0" x2="494.0" y2="92.0" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="494.0" y1="92.0" x2="494.0" y2="100" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="494.0" y1="100" x2="580" y2="100" stroke="#a6e3a1" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="418" y1="241.0" x2="499.0" y2="241.0" stroke="#cba6f7" stroke-width="1.5"/>
  <line x1="499.0" y1="241.0" x2="499.0" y2="250" stroke="#cba6f7" stroke-width="1.5"/>
  <line x1="499.0" y1="250" x2="580" y2="250" stroke="#cba6f7" stroke-width="1.5"/>
  <circle cx="140" cy="110" r="3" fill="#89b4fa" stroke="#89b4fa" stroke-width="0"/>
  <circle cx="110" cy="240" r="3" fill="#f9e2af" stroke="#f9e2af" stroke-width="0"/>
  <text x="56" y="113" text-anchor="end" fill="#89b4fa" font-size="8">A15..A0</text>
  <text x="56" y="243" text-anchor="end" fill="#f9e2af" font-size="8" text-decoration="overline">/IORQ · /WR</text>
  <text x="584" y="103" text-anchor="start" fill="#a6e3a1" font-size="8">#7FFD -&gt; Paging Latch</text>
  <text x="584" y="253" text-anchor="start" fill="#cba6f7" font-size="8">#EFF7 -&gt; Control Register</text>
  <text x="60" y="44" text-anchor="start" fill="#6c7086" font-size="8">Pentagon 1024: paging stays in #7FFD - #EFF7 is a control port</text>
  <text x="60" y="58" text-anchor="start" fill="#a6e3a1" font-size="7">#7FFD: 74138 checks A15=0, A1=0 (128) + A14=1 (1024/SL)</text>
  <text x="60" y="72" text-anchor="start" fill="#cba6f7" font-size="7">#EFF7: 74688 checks A15-A12=1110, A3=0 - 2048 mirrors</text>
  <text x="60" y="385" text-anchor="start" fill="#6c7086" font-size="7">Q side hardwired: 0,0,1,1,1 -&gt; A3=0, A12=0, A13..A15=1</text>
  <text x="60" y="400" text-anchor="start" fill="#6c7086" font-size="7">P5-P7 = Q5-Q7 (neutralized): 11 lines ignored, 2048 mirrors</text>
  <text x="60" y="415" text-anchor="start" fill="#9399b2" font-size="7">Hand-built minimum (Born Dead #10): A3=0, A12=0 + IOWR</text>
  <text x="60" y="430" text-anchor="start" fill="#fab387" font-size="7">#EFF7 bit 2 gates ext RAM: #7FFD bits 5-7 = bank bits 3-5</text>
  <text x="60" y="445" text-anchor="start" fill="#6c7086" font-size="7">Both latches: write-only, cleared by RESET (no readback)</text>
  <text x="420" y="385" text-anchor="start" fill="#9399b2" font-size="7">Decode expressions (I/O write):</text>
  <text x="420" y="400" text-anchor="start" fill="#a6e3a1" font-size="7">#7FFD_CS = ~IORQ &amp; ~WR &amp; ~A15 &amp; A14 &amp; ~A1</text>
  <text x="420" y="415" text-anchor="start" fill="#a6e3a1" font-size="7">   (Pentagon 128 omits A14 -&gt; 16384 mirrors)</text>
  <text x="420" y="430" text-anchor="start" fill="#cba6f7" font-size="7">#EFF7_CS = ~IORQ &amp; ~WR &amp; A15 &amp; A14 &amp; A13 &amp; ~A12 &amp; ~A3</text>
</svg>
