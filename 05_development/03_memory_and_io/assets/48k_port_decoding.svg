<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Menlo','Consolas','Courier New',monospace">
  <rect x="0" y="0" width="560" height="300" fill="#1e1e2e" stroke="#6c7086" stroke-width="1" rx="6"/>
  <text x="280" y="28" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">48K: ULA Port #FE Decoding</text>

  <!-- ===== Component: inv_a0 ===== -->
  <path d="M 160 110 L 196 98 L 196 122 Z" stroke="#9399b2" stroke-width="1.5" fill="#1e1e2e"/>
  <line x1="142" y1="110" x2="160" y2="110" stroke="#9399b2" stroke-width="1.5"/>
  <circle cx="200" cy="110" r="4" fill="#1e1e2e" stroke="#9399b2" stroke-width="1.5"/>
  <line x1="204" y1="110" x2="222" y2="110" stroke="#9399b2" stroke-width="1.5"/>
  <text x="178" y="92" text-anchor="middle" fill="#a6adc8" font-size="7">TR6</text>

  <!-- ===== Component: and_ula ===== -->
  <path d="M 310 108.0 L 329.8 108.0 A 24.200000000000003 17.0 0 0 1 329.8 142.0 L 310 142.0 Z" stroke="#9399b2" stroke-width="1.5" fill="#1e1e2e"/>
  <line x1="292" y1="118.0" x2="310" y2="118.0" stroke="#9399b2" stroke-width="1.5"/>
  <line x1="292" y1="132.0" x2="310" y2="132.0" stroke="#9399b2" stroke-width="1.5"/>
  <line x1="354" y1="125" x2="372" y2="125" stroke="#9399b2" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="50" y1="110" x2="96.0" y2="110" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="96.0" y1="110" x2="142" y2="110" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="222" y1="110" x2="257.0" y2="110" stroke="#9399b2" stroke-width="1.5"/>
  <line x1="257.0" y1="110" x2="257.0" y2="118.0" stroke="#9399b2" stroke-width="1.5"/>
  <line x1="257.0" y1="118.0" x2="292" y2="118.0" stroke="#9399b2" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="50" y1="160" x2="270" y2="160" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="270" y1="160" x2="270" y2="132.0" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="270" y1="132.0" x2="292" y2="132.0" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- ===== Wire ===== -->
  <line x1="372" y1="125" x2="441.0" y2="125" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="441.0" y1="125" x2="510" y2="125" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="46" y="113" text-anchor="end" fill="#89b4fa" font-size="8">A0</text>
  <text x="46" y="163" text-anchor="end" fill="#f9e2af" font-size="8" text-decoration="overline">IORQ</text>
  <text x="514" y="128" text-anchor="start" fill="#a6e3a1" font-size="8">ULA CS (active low)</text>
  <text x="60" y="60" text-anchor="start" fill="#6c7086" font-size="8">Z80 Address Bus</text>
  <text x="370" y="95" text-anchor="start" fill="#9399b2" font-size="8">ULA responds</text>
  <text x="370" y="110" text-anchor="start" fill="#9399b2" font-size="8">when A0=0</text>
  <text x="60" y="230" text-anchor="start" fill="#6c7086" font-size="7">Ferranti ULA checks only A0 (1 line) -&gt; 32,768 mirrors</text>
  <text x="60" y="245" text-anchor="start" fill="#6c7086" font-size="7">TR6 inverter: A0=0 -&gt; ULA selected</text>
  <text x="300" y="230" text-anchor="start" fill="#a6e3a1" font-size="7">ULA_CS = ~IORQ &amp; ~A0</text>
  <text x="300" y="245" text-anchor="start" fill="#6c7086" font-size="7">32,768 mirrors (A1-A15 don't care)</text>
</svg>
